name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version de uv tambien se fija. Sin este "version:", cada corrida
      # instala el uv mas reciente, y una version distinta a la que genero
      # uv.lock puede considerarlo desactualizado y abortar el sync.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true

      # --locked aborta si uv.lock no corresponde a pyproject.toml, en lugar de
      # reescribirlo en silencio. Es la diferencia entre RECONSTRUIR el entorno
      # y REPRODUCIRLO: garantiza que el runner instale el mismo interprete y
      # exactamente las mismas dependencias con verificacion de hash.
      # uv lock --check falla con un mensaje mas explicito que el de --locked
      # cuando pyproject.toml y uv.lock se desincronizan (tipicamente porque se
      # edito el pyproject y no se volvio a commitear el lock regenerado).
      - name: Comprobar que uv.lock corresponde al pyproject.toml
        run: |
          uv --version
          uv lock --check

      - name: Reproducir el entorno desde uv.lock
        run: uv sync --locked

      # Constancia fechada en el registro del job.
      - name: Dejar constancia del entorno
        run: uv run python entorno.py

      # Inventario completo, incluidas las dependencias transitivas.
      - name: Inventario de dependencias instaladas
        run: uv pip list

      # Guarda estatica: detecta modulos importados que no fueron versionados.
      - name: Verificar integridad de imports
        run: uv run python verificar_integridad.py

      - name: Ejecutar la bateria de 32 pruebas con cobertura
        run: uv run python -m pytest pruebas -v --cov=src --cov-report=term-missing

      # Ruff y black viajan en uv.lock: son los MISMOS binarios que en la maquina
      # local. El alcance cubre TODOS los archivos Python del repositorio; dejar
      # alguno fuera haria que la afirmacion de conformidad de estilo fuese
      # parcial sin declararlo.
      - name: Revisar el estilo (pycodestyle-E, pyflakes, orden de imports)
        run: uv run ruff check .

      - name: Comprobar el formato con black
        run: uv run black --check .

      - name: Generar constancia descargable
        if: always()
        run: |
          uv run python entorno.py > constancia_entorno.txt
          uv pip list >> constancia_entorno.txt

      - name: Publicar constancia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constancia-entorno
          path: constancia_entorno.txt
