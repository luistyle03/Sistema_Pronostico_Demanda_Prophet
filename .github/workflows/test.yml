name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Version de Ruff fijada: garantiza que CI y la maquina de desarrollo
  # evaluen con el MISMO analizador. Cambiar solo de forma deliberada.
  RUFF_VERSION: "0.16.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Reconstruir el entorno desde uv.lock
        run: uv sync

      # Guarda estatica: detecta modulos importados que no fueron versionados,
      # tolerando los que estan planificados para sprints posteriores.
      - name: Verificar integridad de imports
        run: uv run python verificar_integridad.py

      - name: Ejecutar la bateria de pruebas
        run: uv run python -m pytest pruebas -v

      - name: Ver version de Ruff
        run: uv run --with "ruff==${RUFF_VERSION}" ruff --version

      - name: Revisar el estilo PEP 8
        run: uv run --with "ruff==${RUFF_VERSION}" ruff check src pruebas herramientas verificar_integridad.py
      