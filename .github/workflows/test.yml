name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Version de Ruff fijada: garantiza que CI y tu maquina evaluen con el
  # MISMO analizador. Cambiar solo de forma deliberada y documentada.
  RUFF_VERSION: "0.16.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Reconstruir el entorno desde uv.lock
        run: uv sync

      # --- GUARDA DE INTEGRIDAD -------------------------------------------
      # Falla de inmediato si algun modulo importado por el codigo no fue
      # versionado en el repositorio (causa raiz del desfase local <-> CI).
      - name: Verificar que todos los modulos importados existen en el repo
        run: |
          uv run python - <<'PY'
          import importlib, sys, pathlib
          sys.path.insert(0, str(pathlib.Path.cwd()))
          faltan = []
          for mod in ["pruebas.prueba_rapida"]:
              try:
                  importlib.import_module(mod)
              except ModuleNotFoundError as e:
                  faltan.append(f"{mod} -> {e.name}")
          if faltan:
              print("MODULOS FALTANTES EN EL REPOSITORIO:")
              for f in faltan:
                  print("  -", f)
              sys.exit(1)
          print("Integridad de imports: OK")
          PY

      - name: Ejecutar la bateria de pruebas
        run: uv run python -m pytest pruebas -v

      - name: Ver version de Ruff
        run: uv run --with "ruff==${RUFF_VERSION}" ruff --version

      - name: Revisar el estilo PEP 8
        run: uv run --with "ruff==${RUFF_VERSION}" ruff check src pruebas herramientas
      