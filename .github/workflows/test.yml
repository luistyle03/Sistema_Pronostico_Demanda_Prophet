name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Reconstruir el entorno desde uv.lock
        run: uv sync
      - name: Ejecutar la batería de 32 pruebas
        run: uv run python -m pytest pruebas -v
      - name: Ver versión de Ruff
        run: uv run --with ruff ruff --version
      - name: Revisar el estilo PEP 8
        run: uv run --with ruff ruff check src pruebas herramientas
      