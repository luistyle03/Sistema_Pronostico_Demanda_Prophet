name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked aborta si uv.lock no corresponde a pyproject.toml, en lugar
      # de reescribirlo en silencio. Garantiza que el entorno del runner sea
      # identico al declarado: mismo Python y mismas dependencias con hash.
      - name: Reconstruir el entorno desde uv.lock
        run: uv sync --locked

      # Constancia de trazabilidad: queda fechada en el registro del job.
      - name: Dejar constancia del entorno
        run: uv run python entorno.py

      # Inventario completo, incluidas las dependencias transitivas.
      - name: Inventario de dependencias instaladas
        run: uv pip list

      # Guarda estatica: detecta modulos importados que no fueron versionados,
      # tolerando los planificados para sprints posteriores.
      - name: Verificar integridad de imports
        run: uv run python verificar_integridad.py

      - name: Ejecutar la bateria de 32 pruebas
        run: uv run python -m pytest pruebas -v

      - name: Revisar el estilo PEP 8
        run: uv run ruff check src pruebas herramientas entorno.py verificar_integridad.py

      # Artefacto descargable con el detalle exacto del entorno de la corrida.
      - name: Generar constancia descargable
        if: always()
        run: |
          uv run python entorno.py > constancia_entorno.txt
          uv pip list >> constancia_entorno.txt

      - name: Publicar constancia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constancia-entorno
          path: constancia_entorno.txt