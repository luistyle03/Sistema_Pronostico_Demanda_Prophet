[project]
name = "spd-tesis"
version = "0.1.0"
description = "Sistema de Pronóstico de Demanda (SPD) basado en el algoritmo Prophet"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask>=3.1.3",
    "holidays>=0.102",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "prophet>=1.3.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
]

# Configuración de estilo y análisis estático (estándar PEP 8)
[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]   # errores de estilo (E), pyflakes (F), orden de imports (I)

[tool.ruff.lint.isort]
# Clasificacion determinista: todo lo que empiece con "src" es codigo propio,
# exista o no el archivo en disco. Evita que el orden exigido cambie entre
# la maquina de desarrollo y el runner de integracion continua.
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Los scripts de herramientas y las pruebas insertan la raíz del proyecto en
# sys.path ANTES de importar de src/, por lo que E402 no aplica: el orden es
# deliberado y necesario para que el script funcione fuera del paquete.
"herramientas/*.py" = ["E402"]
"pruebas/conftest.py" = ["E402"]
"pruebas/prueba_rapida.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.3",
]